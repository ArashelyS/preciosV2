<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Precio de Venta</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Animate.css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <!-- Iconos de FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- Table Export CSS -->
    <style>
        .table th,
        .table td {
            text-align: center;
        }

        .form-control {
            margin-bottom: 1rem;
        }

        .animated {
            animation-duration: 1s;
        }
    </style>
</head>

<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center mb-4 animate__animated animate__fadeIn">Calculadora de Precio de Venta</h2>
                <!-- Formulario de entrada -->
                <div class="card p-4 shadow">
                    <div class="form-group">
                        <label for="concepto">Nombre del Producto:</label>
                        <input type="text" id="concepto" class="form-control" placeholder="Ej. Camiseta" required>
                    </div>
                    <div class="form-group">
                        <label for="costoBase">Costo Base:</label>
                        <input type="number" id="costoBase" class="form-control" placeholder="Costo base del producto" required>
                    </div>
                    <div class="form-group">
                        <label for="ganancia">Porcentaje de Ganancia:</label>
                        <input type="number" id="ganancia" class="form-control" placeholder="Porcentaje de ganancia" required>
                    </div>
                    <button class="btn btn-primary w-100" onclick="calcularPrecio()">Calcular Precio</button>
                </div>
                <div class="mt-4">
                    <h3>Resultado</h3>
                    <p><strong>Precio Sugerido:</strong> <span id="precioSugerido">0</span></p>
                    <p><strong>Margen de Ganancia:</strong> <span id="margenGanancia">0</span>%</p>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <h3>Productos Calculados</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Concepto</th>
                        <th>Costo Base</th>
                        <th>Ganancia (%)</th>
                        <th>Precio Sugerido</th>
                    </tr>
                </thead>
                <tbody id="productosTabla">
                    <!-- Aquí se agregarán los productos calculados -->
                </tbody>
            </table>
            <button class="btn btn-success" onclick="exportarPDF()">Exportar a PDF</button>
            <button class="btn btn-warning" onclick="exportarExcel()">Exportar a Excel</button>
        </div>
    </div>

    <!-- Bootstrap 5 JS y dependencias -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Librería de jsPDF para exportar a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Librería de TableExport para exportar a Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tableexport/5.2.0/js/tableexport.min.js"></script>

    <script>
        function calcularPrecio() {
            const concepto = document.getElementById('concepto').value;
            const costoBase = parseFloat(document.getElementById('costoBase').value);
            const ganancia = parseFloat(document.getElementById('ganancia').value);

            if (isNaN(costoBase) || isNaN(ganancia) || concepto.trim() === "") {
                alert("Por favor ingrese todos los datos correctamente.");
                return;
            }

            const precioSugerido = costoBase * (1 + ganancia / 100);
            const margenGanancia = ganancia;

            // Mostrar los resultados
            document.getElementById('precioSugerido').textContent = precioSugerido.toFixed(2);
            document.getElementById('margenGanancia').textContent = margenGanancia.toFixed(2);

            // Agregar a la tabla de productos calculados
            agregarProductoTabla(concepto, costoBase, ganancia, precioSugerido);
        }

        function agregarProductoTabla(concepto, costoBase, ganancia, precioSugerido) {
            const tablaProductos = document.getElementById('productosTabla');
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td>${concepto}</td>
                <td>${costoBase.toFixed(2)}</td>
                <td>${ganancia.toFixed(2)}</td>
                <td>${precioSugerido.toFixed(2)}</td>
            `;
            tablaProductos.appendChild(fila);
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.autoTable({ html: '.table' });
            doc.save('productos.pdf');
        }

        function exportarExcel() {
            const table = document.querySelector('table');
            TableExport(table, {
                formats: ['xlsx'],
                filename: 'productos',
                bootstrap: true
            });
        }
    </script>
</body>

</html>
